# Jarvis configuration. Paths are relative to this folder unless absolute.
# Secrets (API keys) go in .env, never here.

performance: balanced          # fast | balanced | quality  (jarvis.bat --performance fast, or the tray menu)

assistant:
  name: Jarvis
  user_name: null            # your name (set by the setup wizard in config.local.yaml)
  address: null              # how Jarvis addresses you: sir, ma'am, boss, your name... or null
  follow_up_seconds: 6        # keep listening (no wake word needed) right after a reply
  idle_reset_minutes: 5       # start a fresh conversation after this much silence (memory carries over)
  max_tool_steps: 6           # max tool calls per request before giving up
  ack_after_seconds: 2.5      # if the brain hasn't started answering by then, acknowledge (0 = never)
  ack_phrase: One moment.     # what to say then; empty = a soft chime instead

memory:
  enabled: true
  facts_file: data/memory.json      # "remember that ..." facts, added to every conversation
  history_file: data/history.jsonl  # log of every exchange
  restore_turns: 6                  # replay this many recent exchanges into a new conversation
  restore_within_hours: 12          # ...if they happened within this many hours

wake_word:
  model: hey_jarvis           # built-in openWakeWord model, or a path to your own .onnx
  threshold: 0.5              # 0-1, raise if it triggers by itself, lower if it misses you
  cooldown_seconds: 1.5

hotkey: ctrl+alt+j            # push-to-talk from anywhere (also interrupts); null to disable

barge_in:
  enabled: true               # say "Hey Jarvis" while it's talking to interrupt
  threshold: 0.8              # stricter than normal so its own voice on speakers doesn't trigger it

audio:
  input_device: null          # null = Windows default mic, or an index / part of the name (e.g. "HyperX")
  output_device: null
  chime: true                 # short beep when Jarvis starts / stops listening

recording:
  vad_aggressiveness: 2       # 0-3 (webrtcvad), higher = stricter about what counts as speech
  silence_ms: 700             # answer after this much silence (fast 550 / balanced 700 / quality 950)
  start_timeout_s: 6          # give up if you say nothing after the wake word
  max_seconds: 20

stt:
  provider: faster_whisper
  model: small.en             # tiny.en | base.en | small.en | medium.en | large-v3-turbo
  device: auto                # auto | cuda | cpu
  compute_type: auto          # auto | float16 | int8_float16 | int8
  language: en
  download_root: models/whisper
  hints: "Jarvis, Spotify, YouTube, VS Code, Chrome, Notepad"   # names it should expect; add your own

llm:
  provider: ollama            # ollama | lmstudio | openai_compat | claude   (local is the default)
  temperature: 0.2
  max_history_messages: 20    # local models only; trimmed oldest-first
  providers:
    ollama:
      base_url: http://127.0.0.1:11434   # 127.0.0.1, not localhost: avoids a 2 s IPv6 delay per request on Windows
      model: qwen3.5:4b
      think: false            # qwen3 "thinking" adds seconds of latency; off for voice
      keep_alive: 30m
      num_ctx: 8192
      max_tool_rounds: 1      # small models chain unrequested tools; raise to 2-3 for 8B+ models
    lmstudio:                 # LM Studio local server (Developer tab -> Start server)
      base_url: http://127.0.0.1:1234/v1
      model: local-model
      api_key_env: null
      max_tool_rounds: 1
    openai_compat:            # any OpenAI-compatible endpoint: llama.cpp server, vLLM, Groq, OpenRouter, OpenAI...
      base_url: http://127.0.0.1:8080/v1
      model: local-model
      api_key_env: OPENAI_COMPAT_API_KEY
    claude:
      model: claude-opus-5-5  # claude-sonnet-5-5 / claude-haiku-5-5 are faster and cheaper
      effort: low             # low keeps voice replies quick
      max_tokens: 16000
      api_key_env: ANTHROPIC_API_KEY

tts:                          # all voices are open source and run locally
  voice: friday               # friday (female, British) | amy (female, American) | jarvis (male, British)
                              # HD, needs an NVIDIA GPU: friday-hd | heart-hd | bella-hd | jarvis-hd
                              # windows (built-in voice) | piper / kokoro (use the engine settings below)
                              # Switch any time: "Hey Jarvis, switch to the male voice", tray menu, --voice
  piper:
    voice: en_GB-jenny_dioco-medium   # used with voice: piper; any https://huggingface.co/rhasspy/piper-voices
    length_scale: 0.95        # < 1 speaks faster
    models_dir: models/piper
  kokoro:
    voice: af_heart           # used with voice: kokoro; af_bella, bf_emma, bm_george, am_michael ...
    speed: 1.05
    models_dir: models/kokoro
    device: auto              # auto | cuda | cpu
    allow_cpu: false          # Kokoro on a CPU is slower than real time; HD presets fall back to Piper
  sapi:                       # built-in Windows voices, zero download
    rate: 185
    voice: null               # part of a voice name, e.g. "David" or "Hazel"

media:
  movie_dirs: []              # extra folders with movies/series (Videos, Downloads and any D:\Movies, E:\Series... are found automatically)
  auto_find_movie_folders: true
  vlc_path: null              # found automatically; set if VLC is somewhere unusual
  default_app: spotify        # "play some music" with nothing open starts this; null = don't

ducking:                      # turn whatever is playing down while Jarvis listens and talks
  enabled: true
  level: 0.3                  # 30% of the app's own volume; restored afterwards (1.0 = don't duck)

router:
  enabled: true               # fast path: common commands run instantly without the brain

tools:
  confirm_dangerous: true     # ask "shall I proceed?" before risky actions
  allow_shell: false          # let Jarvis run PowerShell commands (always asks first)
  ask_claude: true            # "ask Claude ..." escalation tool, only active if ANTHROPIC_API_KEY is set
  weather: true               # uses wttr.in (needs internet)
  notes_file: data/notes.md
  screenshots_dir: ~/Pictures/Jarvis
  search_dirs: [~/Desktop, ~/Documents, ~/Downloads]
  disabled: []                # tool names never offered to the brain, e.g. [wifi, theme, power]

google:                       # Calendar + Gmail; tools appear once the credentials file exists
  enabled: true
  credentials_file: secrets/google_credentials.json   # OAuth client (Desktop app) from Google Cloud
  token_file: secrets/google_token.json               # created by: jarvis.bat --google-login

github:                       # GitHub by voice; uses the GitHub CLI's login (winget install GitHub.cli, gh auth login)
  enabled: true               # tools appear only when `gh` is installed
  default_repo: null          # owner/name used when you don't name one ("did the build pass?")
  watch: []                   # repos whose failed builds Jarvis announces, e.g. [you/jarvis]
  alerts: true
  poll_minutes: 3

files:                        # file access by voice (browse, read, create, rename, move, tidy, delete to Recycle Bin)
  allowed_roots: auto         # where Jarvis may change files. auto = your user folder + non-system drives,
                              # or a list, e.g. [~/Documents, ~/Downloads, "D:/"]. Reading works anywhere.
  protected: []               # extra folders to keep read-only (Windows, Program Files, AppData... always are)

vision:                       # "look at my screen" / "what does this error say?"
  enabled: true
  provider: ollama            # ollama (qwen3.5 can see, stays local) | claude
  model: null                 # null = the brain's model for that provider

routines:                     # your own multi-step workflows: "run good morning", "work mode", "movie mode"
                              # steps = any tool + its arguments, or "wait: <seconds>"
  good morning:
    say: Good morning.
    steps:
      - get_datetime
      - get_weather: {}             # {} = your location from IP; or {location: Your City}
      - calendar_upcoming: {days: 1}    # skipped until Google is connected
      - web_lookup: {query: top headlines today, news: true}
    summarize: true                 # the brain turns the results into a short briefing
    # schedule: {time: "08:00", days: [mon, tue, wed, thu, fri]}   # uncomment to run it every weekday
  work mode:
    say: Work mode is on.
    steps:
      - desktop_action: {action: minimize_all}
      - open_app: {name: Visual Studio Code}
      - wait: 3                       # let VS Code open before snapping it
      - window_action: {name: Visual Studio Code, action: snap_left}
      - open_app: {name: Google Chrome}
      - wait: 2
      - window_action: {name: chrome, action: snap_right}
      - volume: {action: set, percent: 30}
    summarize: false
  focus mode:
    say: Focus mode for 25 minutes. I'll tell you when to take a break.
    steps:
      - desktop_action: {action: minimize_all}
      - volume: {action: set, percent: 15}
      - set_timer: {seconds: 1500, message: Focus session done. Time for a five minute break.}
    summarize: false
  movie mode:
    say: Enjoy the film.
    steps:
      - theme: {mode: dark}
      - desktop_action: {action: minimize_all}
      - volume: {action: set, percent: 70}
    summarize: false
  status report:
    steps:
      - system_status
      - top_processes: {sort: memory, count: 3}

# MCP servers: give Jarvis the tools of any Model Context Protocol server (see README "MCP servers").
mcp_servers: {}
